<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Controle de Veículos</title>

    <style>
        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BODY
        ============================== */

        body {
            min-height: 100vh;
            min-height: 100dvh;

            font-family: "Inter", "Segoe UI", Arial, sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59, 130, 246, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.20),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080b14,
                    #111827 50%,
                    #0f172a
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            position: relative;
            overflow: hidden;
        }


        /* ==============================
           EFEITOS DE FUNDO
        ============================== */

        body::before,
        body::after {
            content: "";

            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.35;

            z-index: 0;

            pointer-events: none;
        }


        body::before {
            background: #2563eb;

            top: -100px;
            left: -100px;
        }


        body::after {
            background: #7c3aed;

            bottom: -120px;
            right: -100px;
        }


        /* ==============================
           CARD DE CADASTRO
        ============================== */

        .cadastro {
            position: relative;

            z-index: 2;

            width: min(430px, 100%);

            padding: 36px;

            background: rgba(15, 23, 42, 0.72);

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 28px;

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            animation: aparecer 0.7s ease-out;
        }


        /* ==============================
           ÍCONE
        ============================== */

        .icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 12px 30px rgba(37, 99, 235, 0.35);

            animation: flutuar 3s ease-in-out infinite;
        }


        /* ==============================
           TÍTULO
        ============================== */

        h2 {
            text-align: center;

            font-size: clamp(27px, 6vw, 34px);

            font-weight: 800;

            letter-spacing: -1.3px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #bfdbfe
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        /* ==============================
           SUBTÍTULO
        ============================== */

        .subtitle {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;

            margin-bottom: 26px;
        }


        /* ==============================
           FORMULÁRIO
        ============================== */

        form {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }


        /* ==============================
           CAMPOS
        ============================== */

        input {
            width: 100%;

            min-height: 50px;

            padding: 0 15px;

            font-family: inherit;
            font-size: 14px;

            color: #fff;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 14px;

            outline: none;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }


        input::placeholder {
            color: #64748b;
        }


        input:hover {
            background: rgba(255, 255, 255, 0.075);

            border-color: rgba(255, 255, 255, 0.14);
        }


        input:focus {
            background: rgba(255, 255, 255, 0.08);

            border-color: rgba(96, 165, 250, 0.65);

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }


        input[type="date"] {
            color: #cbd5e1;

            color-scheme: dark;
        }


        /* ==============================
           BOTÃO
        ============================== */

        button {
            position: relative;

            width: 100%;

            min-height: 52px;

            margin-top: 5px;

            padding: 0 18px;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            border: none;

            border-radius: 14px;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }


        /* Brilho do botão */

        button::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.18),
                    transparent
                );

            transform: translateX(-100%);

            transition: transform 0.5s ease;
        }


        button:hover::before {
            transform: translateX(100%);
        }


        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.35);

            filter: brightness(1.08);
        }


        button:active {
            transform: translateY(0);
        }


        /* ==============================
           RODAPÉ
        ============================== */

        .footer {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;

            color: #475569;
        }


        .status {
            display: inline-flex;

            align-items: center;

            gap: 7px;
        }


        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px rgba(34, 197, 94, 0.8);

            animation: pulsar 2s ease-in-out infinite;
        }


        /* ==============================
           ANIMAÇÕES
        ============================== */

        @keyframes aparecer {
            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes flutuar {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        @keyframes pulsar {
            0%,
            100% {
                opacity: 1;

                transform: scale(1);
            }

            50% {
                opacity: 0.6;

                transform: scale(0.85);
            }
        }


        /* ==============================
           ACESSIBILIDADE
        ============================== */

        input:focus-visible,
        button:focus-visible {
            outline: 2px solid #60a5fa;

            outline-offset: 3px;
        }


        /* ==============================
           RESPONSIVIDADE
        ============================== */

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }


            .cadastro {
                width: 100%;

                padding: 30px 22px;

                border-radius: 23px;
            }


            .icon {
                width: 62px;
                height: 62px;

                font-size: 27px;

                border-radius: 18px;

                margin-bottom: 18px;
            }


            h2 {
                font-size: 28px;
            }


            .subtitle {
                font-size: 13px;

                margin-bottom: 22px;
            }


            input {
                min-height: 48px;

                padding: 0 13px;

                font-size: 13px;
            }


            button {
                min-height: 50px;
            }
        }


        /* ==============================
           REDUÇÃO DE ANIMAÇÕES
        ============================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>


<body>

<main class="cadastro">

    <!-- Ícone principal -->
    <div class="icon">
        👤
    </div>


    <!-- Título -->
    <h2>
        Crie seu Cadastro
    </h2>


    <!-- Subtítulo -->
    <p class="subtitle">
        Preencha seus dados para criar sua conta.
    </p>


    <!-- Formulário -->
    <form method="post" action="/efetuar-cadastro">

        <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Nome"
                autocomplete="name"
                required
        >

        <input
                type="text"
                name="cpf"
                id="cpf"
                placeholder="CPF"
                autocomplete="off"
                required
        >

        <input
                type="email"
                name="email"
                id="email"
                placeholder="E-mail"
                autocomplete="email"
                required
        >

        <input
                type="password"
                name="senha"
                id="senha"
                placeholder="Senha"
                autocomplete="new-password"
                required
        >

        <input
                type="text"
                name="telefone"
                id="telefone"
                placeholder="Telefone"
                autocomplete="tel"
                required
        >

        <input
                type="date"
                name="datanascimento"
                id="datanascimento"
                required
        >

        <button type="submit">
            Cadastrar
        </button>

    </form>


    <!-- Rodapé -->
    <div class="footer">
            <span class="status">
                <span class="status-dot"></span>
                Sistema operacional
            </span>
    </div>

</main>

</body>
</html>
